name: Build & Publish Release (Windows + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (e.g. v2.1.0) to publish when running manually'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Adobe Tools.exe
        shell: pwsh
        run: |
          & .\build.ps1
          & '.\Adobe Tools.exe' selftest

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: Adobe-Tools-Windows
          path: Adobe Tools.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Universal .app, .dmg and .pkg
        run: |
          chmod +x macos/build-macos.sh
          ./macos/build-macos.sh

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: Adobe-Tools-macOS
          path: |
            dist/macos/Adobe-Tools-macOS-Universal.dmg
            dist/macos/Adobe-Tools-macOS-Universal.pkg
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Adobe-Tools-Windows
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Adobe-Tools-macOS
          path: release-assets

      - name: Generate SHA256SUMS.txt & Release Notes
        run: |
          cd release-assets
          sha256sum "Adobe Tools.exe" "Adobe-Tools-macOS-Universal.dmg" "Adobe-Tools-macOS-Universal.pkg" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          TAG_MSG="$(git tag -l --format='%(contents)' "$TAG")"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            if [ -n "$TAG_MSG" ]; then
              printf '%s\n' "$TAG_MSG"
            elif [ -n "$PREV_TAG" ]; then
              echo "### 更新内容"
              git log --pretty=format:'- %s (%h)' "${PREV_TAG}..${TAG}"
              echo ""
            fi
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name: Adobe Tools ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/Adobe Tools.exe
            release-assets/Adobe-Tools-macOS-Universal.dmg
            release-assets/Adobe-Tools-macOS-Universal.pkg
            release-assets/SHA256SUMS.txt
